# Installed as /opt/jitsi/.jitsi-meet-cfg/web/nginx-custom/rtcstats.conf
# (included inside the meet.speexify.com server block). Routes Jitsi's rtcstats
# WebSocket to the speexify-rtcstats container on the Jitsi Docker network.
location ^~ /rtcstats/ {
    # Resolve at request time so nginx still starts if the collector is down.
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $rtcstats_upstream http://speexify-rtcstats:8099;
    rewrite ^/rtcstats/(.*)$ /$1 break;
    proxy_pass $rtcstats_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 900s;
    proxy_send_timeout 900s;
}
