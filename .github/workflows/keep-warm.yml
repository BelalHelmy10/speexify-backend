name: Keep backend warm

# Render's free tier sleeps after ~15 min of inactivity and then takes
# ~30-50s to cold-start, which shows up as a ~1 min blank screen on login.
# Pinging the (unauthenticated, lightweight) health endpoint on a short
# interval keeps the instance awake so logins stay fast.
#
# Set the repo variable BACKEND_HEALTH_URL to the backend's own origin for the
# most direct wake (e.g. https://api.speexify.com/api/health). If unset, it
# falls back to the public site, which proxies /api to the backend.
#
# NOTE: on a PRIVATE repo this consumes GitHub Actions minutes (~1 min/run, so
# ~4,300/mo at */10 vs the 2,000 free). For zero CI minutes, prefer a free
# external monitor (e.g. UptimeRobot) hitting the same URL, or upgrade Render
# to an always-on instance and delete this workflow.

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping health endpoint
        run: |
          URL="${{ vars.BACKEND_HEALTH_URL }}"
          if [ -z "$URL" ]; then URL="https://speexify.com/api/health"; fi
          echo "Pinging $URL"
          # --max-time covers a full cold start; a failure still triggers the
          # wake, so don't fail the job (avoids noisy keep-warm alert emails).
          curl -fsS --max-time 90 --retry 2 --retry-delay 10 "$URL" \
            || echo "Ping did not return OK (server may be cold-starting); wake was still triggered."
